<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122124"><title>废土回声 · 幸存者地堡</title><link rel="stylesheet" href="/style.css"></head><body class="in-bunker">
<canvas id="scene" aria-label="废土回声世界场景"></canvas><div class="vignette"></div>
<header><a class="brand" href="/"><span>◈</span><div>废土回声<small>WASTELAND ECHO</small></div></a><div class="location"><i></i><span id="location">连接地堡中</span><small id="scene-status">SHARED WORLD</small></div><div class="top-actions"><button id="room-button" aria-label="联机小队">♧ <span id="room-label">小队</span></button><button id="save-button" aria-label="手动保存"><span>↧</span> <small id="save-label">保存</small></button><button id="settings" aria-label="操作布局设置">⚙ <span>操作</span></button><button id="help" aria-label="帮助">?</button></div></header>
<div id="hud"><section class="mission-panel"><div class="eyebrow" id="mission-label">HOME / EMBER 07</div><h2 id="mission-title">回到有人等待的地方</h2><p id="mission-description">走动探索地堡，靠近设施进行互动。</p><div class="supplies"><span>◈ <b id="crystal">0</b></span><span>◌ <b id="coin">0</b></span><span>▰ <b id="fuel">20</b></span></div><div id="run-details" hidden><span id="run-time">00:00</span><span id="rad-label">辐射 0%</span><div class="rad-track"><i id="rad-fill"></i></div></div></section>
<section id="team"></section><section class="map-panel"><canvas id="minimap" width="190" height="140"></canvas><div><span id="map-label">地堡内部</span><small id="connection">连接中…</small></div></section>
<section id="station-panel" hidden><div class="eyebrow" id="station-kind">INTERACTION</div><h3 id="station-name"></h3><p id="station-detail"></p><span id="station-action"></span></section>
<div id="boss-bar" hidden><small>巨型蚯蚓 · 掘地者</small><div><i></i></div><span></span></div><div id="interact-hint"></div><div id="run-event"></div>
<section id="player-status"><div id="status-bar" aria-label="当前状态"></div><div class="player-heading"><strong id="player-name"></strong><span id="hp-text"></span></div><div class="hp-track"><i id="hp-fill"></i></div><div class="resource-track"><i id="resource-fill"></i></div><small id="resource-text"></small></section>
<div id="controls"><div id="move-stick" class="stick" role="button" aria-label="移动摇杆"><div class="stick-guide">✥</div><span class="stick-knob"></span><small>移动</small></div>
<div id="action-cluster"><button id="attack" class="round attack" aria-label="攻击，拖动瞄准"><span class="attack-symbol">⌖</span><span class="attack-knob"></span><small>攻击 / 瞄准</small><kbd>鼠标</kbd></button>
<button id="skill-0" class="round skill" data-skill="0"><kbd>1</kbd><span class="glyph">◇</span><small>技能一</small><b class="cooldown"></b></button><button id="skill-1" class="round skill" data-skill="1"><kbd>2</kbd><span class="glyph">◎</span><small>技能二</small><b class="cooldown"></b></button><button id="skill-2" class="round skill" data-skill="2"><kbd>3</kbd><span class="glyph">✦</span><small>技能三</small><b class="cooldown"></b></button>
<button id="dodge" class="round"><kbd>空格</kbd><span class="glyph">↯</span><small>闪避</small><b class="cooldown"></b></button><button id="interact" class="round"><kbd>E</kbd><span class="glyph">✋</span><small>互动</small></button>
<button id="heal" class="round consumable"><kbd>Q</kbd><span>✚</span><small id="heal-count">3</small></button><button id="antirad" class="round consumable"><kbd>R</kbd><span>☢</span><small id="rad-count">3</small></button></div></div>
<div id="controls-note">WASD 移动 · E 与身边设施互动 · 走到右侧气闸准备出发</div><div id="ready-status"></div></div>
<dialog id="modal"><button class="close" id="close-modal" aria-label="关闭">×</button><div id="modal-content"></div></dialog><div id="toast" role="status"></div><div id="disconnect" hidden>连接中断 · 正在重连，探索中由 AI 接管…</div><div id="loading">◈<span>正在接入余烬号…</span></div>
<script type="module" src="/app.mjs"></script></body></html>
